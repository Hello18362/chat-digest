name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      # Windows runner 的默认代码页不是中文，程序里有大量中文输出；
      # 不强制 UTF-8 会抛 UnicodeEncodeError（本地中文系统上不会暴露）。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Regression tests
        run: python tests/test_regression.py

      # 控制台集成校验需要先起服务；服务没起来时测试会自动跳过（退出码 0），
      # 所以这里不单独起服务也不会把 CI 弄红。
      - name: Console integration (self-skips without a server)
        run: python tests/test_server.py
